<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents Farm</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <!-- Top: status bar -->
  <header id="status-bar">
    <h1>Agents Farm</h1>
    <p>
      <label><input type="checkbox" id="learning-mode" checked> Learning mode</label> ·
      <span id="farmer-count">0 farmers</span> · <span id="connection" class="offline">offline</span>
    </p>
  </header>

  <!-- Center: the farm is drawn inside this canvas by farm.js -->
  <main id="farm">
    <canvas id="farm-canvas"></canvas>
  </main>

  <!-- Right: log of what the farmers do -->
  <aside id="log-panel">
    <h2>Log</h2>
    <ul id="log">
      <li id="log-waiting">Waiting for events…</li>
    </ul>
  </aside>

  <!-- farm.js draws the farm, learning.js writes plain sentences, agents.js moves the farmers -->
  <script src="farm.js"></script>
  <script src="learning.js"></script>
  <script src="agents.js"></script>
  <script src="connection.js"></script>
</body>
</html>
